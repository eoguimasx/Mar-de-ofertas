<style>
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

:root{
	/* ── superfícies: o preto/carvão da fachada e das placas ── */
	--breu:#08090B;
	--carvao:#0E1013;
	--grafite:#15181D;
	--fumaca:#1C2027;
	--concreto:#2E343C;
	--concreto-claro:#3E464F;

	/* ── dourado da marca (letreiro "Mar de ofertas") ── */
	--ouro:#F0B429;
	--ouro-claro:#FFD166;
	--ouro-fundo:#9A6B0C;

	/* ── azul da onda (cores reais do logo) ── */
	--onda-clara:#97CCDF;

	/* ── creme dos tijolos ── */
	--creme:#E8E4DA;
	--creme-forte:#F7F4ED;

	--cinza:#8D97A4;
	--cinza-fraco:#5C6570;

	/* ── sinal ── */
	--verde:#2DBE6C;
	--vermelho:#F0514A;
	--whatsapp:#25D366;
	--whatsapp-fundo:#128C7E;

	/* ── elevação: no escuro, sombra preta + friso de luz no topo ── */
	--sh2: 0 2px 6px rgba(0,0,0,.45), 0 8px 20px rgba(0,0,0,.35);
	--sh3: 0 4px 10px rgba(0,0,0,.5), 0 16px 38px rgba(0,0,0,.42);
	--sh4: 0 10px 24px rgba(0,0,0,.55), 0 32px 72px rgba(0,0,0,.5);
	--friso: inset 0 1px 0 rgba(255,255,255,.07);

	--r-sm:12px; --r-md:18px; --r-lg:24px; --r-xl:30px;
}

html{ scroll-behavior:smooth; }
html,body{ overflow-x:hidden; }
body{
	padding-bottom:calc(24px + env(safe-area-inset-bottom));
	font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
	background:var(--carvao);
	color:var(--creme);
	line-height:1.5;
	-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{ font-family:'Bricolage Grotesque','Inter',sans-serif; font-weight:700; letter-spacing:-.02em; line-height:1.05; color:var(--creme-forte); }
/* o espaço extra no fim só existe quando a barra do pedido está visível */
body.has-order{ padding-bottom:calc(104px + env(safe-area-inset-bottom)); }
button,input,select{ font-family:inherit; }
:focus-visible{ outline:3px solid var(--ouro); outline-offset:2px; border-radius:6px; }
